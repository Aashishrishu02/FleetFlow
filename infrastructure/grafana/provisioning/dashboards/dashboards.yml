# ==============================================================================
# Grafana Dashboard Provisioning — FleetFlow
# ==============================================================================
# Loads dashboard JSON files from /var/lib/grafana/dashboards on startup.
# Dashboard files will be added as the platform matures.
# ==============================================================================

apiVersion: 1

providers:
  - name: "FleetFlow"
    orgId: 1
    folder: "FleetFlow"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

